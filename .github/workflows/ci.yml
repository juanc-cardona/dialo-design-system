name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: npm run build
      - name: Contraste y reglas de marca
        run: npm run check
      - name: dist/ está al día
        run: git diff --exit-code -- dist || (echo "Ejecuta npm run build y versiona dist/" && exit 1)
